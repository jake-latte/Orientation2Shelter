[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o2s"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "psutil",
  "scikit-learn",
  "scipy",
  "torch",
  "umap-learn",
  "wandb",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
